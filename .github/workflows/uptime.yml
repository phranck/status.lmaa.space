# Transitional Upptime monitor retained until Velvet owns endpoint checks in
# Milestone 2. The repository token is sufficient for history and incident
# updates; downstream Velvet workflows are chained with workflow_run.
name: Uptime CI

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.43.12
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{"GLOBALPING_TOKEN":${{ toJson(secrets.GLOBALPING_TOKEN) }}}'
