# Build and deploy the native Velvet page after configuration changes or a
# successful monitoring run.
name: Velvet Pages

on:
  push:
    branches: [main]
    paths:
      - "velvet.yml"
      - "assets/**"
      - ".github/workflows/velvet.yml"
  workflow_run:
    workflows: ["Velvet status", "Velvet response times"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: velvet-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check out Velvet data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: velvet-data
          path: .velvet-data
      - name: Build Velvet site
        uses: phranck/velvet@ced0142c342e9373227b81cfc1bcbb58585d0ec5
        with:
          config: velvet.yml
          data: .velvet-data/velvet-data/v1
          output: velvet-dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: velvet-dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
