name: Sync Velvet data

on:
  push:
    branches: [main]
    paths:
      - ".upptimerc.yml"
      - "history/**"
      - ".github/workflows/sync-velvet-data.yml"
  issues:
    types: [closed, reopened, edited, labeled, unlabeled]
  repository_dispatch:
    types: [velvet_sync]
  workflow_run:
    workflows: ["Response Time CI", "Summary CI"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Publish normalized data
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Sync Velvet data
        uses: phranck/velvet/actions/sync-data@b4d7f3184cec50a532faeb67b5dc61acb50c752f
