# The planned-maintenance Issue Form is the normal path. This manual Action is
# a compact fallback for opening a maintenance window from the Actions tab.
name: Maintenance switch

on:
  workflow_dispatch:
    inputs:
      message:
        description: "What is happening"
        required: true
      services:
        description: "Service IDs, comma-separated"
        required: true
        default: "website"
      minutes:
        description: "Expected duration in minutes"
        required: false
        default: "30"

permissions:
  contents: write
  issues: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open planned maintenance
        uses: actions/github-script@v7
        with:
          script: |
            const inputs = context.payload.inputs || {};
            const services = new Map([
              ["backend", "Backend"],
              ["dashboard", "Dashboard"],
              ["database", "Database"],
              ["storage", "Storage"],
              ["website", "Website"],
            ]);
            const selected = [...new Set(
              String(inputs.services || "")
                .split(",")
                .map((value) => value.trim().toLowerCase())
                .filter(Boolean),
            )];
            const unknown = selected.filter((serviceId) => !services.has(serviceId));
            if (selected.length === 0 || unknown.length > 0) {
              core.setFailed(
                unknown.length > 0
                  ? `Unknown service IDs: ${unknown.join(", ")}`
                  : "Select at least one service ID.",
              );
              return;
            }

            const requestedMinutes = Number(inputs.minutes);
            const minutes = Number.isFinite(requestedMinutes) && requestedMinutes > 0
              ? Math.min(1440, Math.floor(requestedMinutes))
              : 30;
            const start = new Date();
            const end = new Date(start.getTime() + minutes * 60000);
            const message = String(inputs.message || "Planned maintenance").trim();
            const targets = selected.map(
              (serviceId) => `- ${services.get(serviceId)} (all checks) [${serviceId}/*]`,
            );
            const body = [
              "### Affected services and checks",
              "",
              ...targets,
              "",
              "### Starts at",
              "",
              start.toISOString(),
              "",
              "### Ends at",
              "",
              end.toISOString(),
              "",
              "### Summary",
              "",
              message,
              "",
              "Close this issue to end the maintenance window early.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Maintenance] ${message}`,
              labels: ["maintenance"],
              body,
            });
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "velvet-monitor",
            });
