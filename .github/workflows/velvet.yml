# Build and deploy Velvet through the official GitHub Pages workflow. Public
# data comes exclusively from the validated Velvet v1 documents.
name: Velvet

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/velvet.yml"
  workflow_run:
    workflows: ["Sync Velvet data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: velvet-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build Velvet site
        uses: phranck/velvet@b4d7f3184cec50a532faeb67b5dc61acb50c752f
        with:
          config: .upptimerc.yml
          data: velvet-data/v1
          output: velvet-dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: velvet-dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
