name: Planned maintenance
description: Schedule maintenance and show it in the status history.
title: "[Maintenance] "
labels:
  - maintenance
body:
  - type: markdown
    attributes:
      value: Velvet keeps monitoring during maintenance. Select only the services and checks covered by this work.
  - type: dropdown
    id: affected-targets
    attributes:
      label: Affected services and checks
      description: Select every service or individual check covered by this maintenance.
      multiple: true
      options:
        - Backend (all checks) [backend/*]
        - Backend / Backend [backend/backend]
        - Dashboard (all checks) [dashboard/*]
        - Dashboard / Dashboard [dashboard/dashboard]
        - Database (all checks) [database/*]
        - Database / Database [database/database]
        - Storage (all checks) [storage/*]
        - Storage / Storage [storage/storage]
        - Website (all checks) [website/*]
        - Website / Website [website/website]
    validations:
      required: true
  - type: input
    id: starts-at
    attributes:
      label: Starts at
      description: Use an ISO 8601 timestamp with a time zone, for example 2026-08-01T22:00:00+02:00.
      placeholder: "2026-08-01T22:00:00+02:00"
    validations:
      required: true
  - type: input
    id: ends-at
    attributes:
      label: Ends at
      description: Use an ISO 8601 timestamp with a time zone, for example 2026-08-01T23:30:00+02:00.
      placeholder: "2026-08-01T23:30:00+02:00"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the planned work.
      placeholder: Database and application updates.
    validations:
      required: true
