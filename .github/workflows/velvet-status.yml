name: Velvet status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [velvet-monitor]

permissions:
  contents: write
  issues: write

concurrency:
  group: velvet-status-data
  cancel-in-progress: false

jobs:
  monitor:
    name: Check services
    runs-on: ubuntu-latest
    steps:
      - name: Check out status repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish Velvet status
        uses: phranck/velvet/actions/monitor@fd5889d73c56569d009cb1149acfd43ebe411bf7
        with:
          mode: status
