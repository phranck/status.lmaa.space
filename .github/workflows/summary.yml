# Transitional Upptime summary generator retained until Velvet owns endpoint
# checks in Milestone 2. Velvet never reads the generated README directly.
name: Summary CI

on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  release:
    name: Generate summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Update summary data
        uses: upptime/uptime-monitor@v1.43.12
        with:
          command: "readme"
        env:
          GH_PAT: ${{ github.token }}
