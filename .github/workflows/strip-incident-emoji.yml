# Upptime hardcodes a leading status emoji in incident titles. Normalize new
# user-created issues immediately and Upptime-created incidents after each
# monitor run, then publish a fresh Velvet snapshot.
name: Strip incident emoji

on:
  issues:
    types: [opened]
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]

permissions:
  contents: write
  issues: write

jobs:
  strip:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = context.eventName === "issues"
              ? [context.payload.issue]
              : await github.paginate(github.rest.issues.listForRepo, {
                  owner,
                  repo,
                  state: "open",
                  labels: "status",
                  per_page: 100,
                });

            for (const issue of issues) {
              const title = issue.title || "";
              const stripped = title.replace(/^[\p{Extended_Pictographic}️‍\s]+/u, "").trim();
              if (stripped && stripped !== title) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  title: stripped,
                });
                core.info(`Stripped emoji from issue #${issue.number}`);
              }
            }

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "velvet_sync",
            });
