# Transitional Upptime response sampler retained until Velvet owns endpoint
# checks in Milestone 2. Its output is normalized by the Velvet sync workflow.
name: Response Time CI

on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.43.12
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{"GLOBALPING_TOKEN":${{ toJson(secrets.GLOBALPING_TOKEN) }}}'
